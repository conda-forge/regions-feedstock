{% set version = "0.12" %}

package:
  name: regions
  version: "{{ version }}"

source:
  url: https://pypi.org/packages/source/r/regions/regions-{{ version }}.tar.gz
  sha256: 1c9460770f250ef299e90a9d5c0b35941f7d05bbf879f6ffaa0538250c018ef9

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv
  skip: true  # [py<311]

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython                                 # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
  host:
    - python
    - pip
    - setuptools
    - setuptools_scm >=8.2
    - cython >=3.1.2,<4
    - extension-helpers >=1.3,<2
    - numpy
    - astropy-base >=6.1.7
  run:
    - python
    - astropy-base >=6.1.7
    - matplotlib-base >=3.9

test:
  requires:
    - pytest-astropy
  imports:
    - regions
    - regions.core
    - regions.io
    - regions.shapes

about:
  home: https://github.com/astropy/regions
  license: BSD-3-Clause
  license_file: LICENSE.rst
  license_family: BSD
  summary: Astropy coordinated package for region handling
  description: |
    Regions is a package for region handling based on Astropy. The
    eventual goal is to merge this package into the Astropy core
    package.
  doc_url: https://astropy-regions.readthedocs.io
  dev_url: https://github.com/astropy/regions

extra:
  recipe-maintainers:
    - larrybradley
    - mwcraig
    - bsipocz
