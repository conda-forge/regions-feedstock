{% set version = "0.13" %}

package:
  name: regions
  version: "{{ version }}"

source:
  url: https://files.pythonhosted.org/packages/source/r/regions/regions-{{ version }}.tar.gz
  sha256: 4026a02bbdb84b7e4f61cdebb436d3889147d725d9b15db93cd9f7c54567e25c

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv
  skip: true  # [py<312]

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython >=3.1.2,<4                       # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
  host:
    - python
    - pip
    - astropy-base >=7.0
    - cython >=3.1.2,<4
    - extension-helpers >=1.4,<2
    - numpy
    - setuptools >=77.0.1
    - setuptools_scm >=8.2
  run:
    - python
    - astropy-base >=7.0
    - matplotlib-base >=3.10

test:
  requires:
    - pytest-astropy
  imports:
    - regions
    - regions.core
    - regions.io
    - regions.shapes

about:
  home: https://github.com/astropy/regions
  license: BSD-3-Clause
  license_file: LICENSE.rst
  license_family: BSD
  summary: Astropy coordinated package for region handling
  description: |
    Regions is a package for region handling based on Astropy. The
    eventual goal is to merge this package into the Astropy core
    package.
  doc_url: https://astropy-regions.readthedocs.io
  dev_url: https://github.com/astropy/regions

extra:
  recipe-maintainers:
    - larrybradley
    - mwcraig
    - bsipocz
